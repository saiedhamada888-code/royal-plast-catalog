<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Plast Admin</title>
<link rel="icon" href="images/logo-mark.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#F2222B;--cyan:#1FE0FD;--sky:#5CE6FF;--ink:#0E1A2B;--bg:#F4F8FB;--card:#fff;--line:#E3EAF0;--muted:#6B7A8C;--ok:#16A34A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
input[type=color]{width:46px;height:40px;padding:3px;flex:none}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--ink);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 22px}
.logo img{width:42px;height:42px;border-radius:12px;background:#fff;padding:5px}
.logo b{display:block;font-size:16px}.logo small{opacity:.6;font-size:12px}
.nav-b{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;font-weight:500;opacity:.75;text-align:left;transition:all .2s}
.nav-b svg{width:19px;height:19px;flex:none}
.nav-b:hover{opacity:1;background:#ffffff12}
.nav-b.on{opacity:1;background:var(--red);box-shadow:0 8px 18px #f2222b55}
aside .sp{flex:1}
.saved{font-size:12px;opacity:.7;padding:8px 14px;display:flex;align-items:center;gap:8px}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
main{padding:26px 34px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:24px}
.top p{color:var(--muted);font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;font-weight:600;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px #f2222b40}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{border:1.5px solid var(--line);background:#fff}
.btn-line:hover{border-color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:4px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#3b4859}
.f small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.f.full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;min-width:200px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:60px 1.1fr 1.5fr 1fr .8fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:box-shadow .2s,border-color .2s}
.item:hover{border-color:#cfd9e3;box-shadow:0 6px 16px #0e1a2b0d}
.item.hidden{opacity:.5}
.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.code{background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;justify-self:start}
.item .nm{font-weight:600}
.item .meta{color:var(--muted);font-size:12.5px}
.tags{display:flex;gap:6px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg)}
.tag.star{background:#FFF4D6;color:#A16207}
.ibtns{display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#4b5a6b;transition:background .2s,color .2s}
.ib:hover{background:var(--bg);color:var(--ink)}
.ib.del:hover{background:#FEE2E2;color:var(--red)}
.ib svg{width:17px;height:17px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#0e1a2b80;backdrop-filter:blur(4px);display:none;justify-content:flex-end}
.modal.open{display:flex}
.drawer{width:min(620px,100%);height:100%;background:var(--bg);overflow:auto;padding:24px;animation:slide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer-h h2{font-size:20px}
.img-edit{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.img-prev{width:150px;height:150px;border-radius:18px;border:1.5px solid var(--ink);object-fit:cover;background:#fff}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#FFF7E6;border:1px solid #FCD9A0;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px}
.banner span{flex:1;min-width:240px}
.colors-ed{display:flex;flex-direction:column;gap:8px}
.colors-ed .row input[type=text]{flex:1}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.drawer-f{position:sticky;bottom:-24px;margin:20px -24px -24px;padding:16px 24px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sw{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px}
.sw div{flex:1}
.sw b{display:block;font-size:13px}
.sw input[type=text]{padding:6px 10px;font-size:13px}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ph button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;font-family:monospace}
.ph button:hover{border-color:var(--red);color:var(--red)}
.msg-prev{white-space:pre-wrap;background:#E7FFDB;border-radius:12px 12px 2px 12px;padding:14px 16px;font-size:13.5px;line-height:1.55;max-width:420px;box-shadow:0 2px 6px #0001;margin-left:auto}
.wa-bg{background:#EFE7DD;border-radius:14px;padding:20px}
.qr-prev{width:120px;height:120px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-prev canvas,.qr-prev img{width:100%!important;height:100%!important}
.steps-ol{counter-reset:s;list-style:none;display:flex;flex-direction:column;gap:12px}
.steps-ol li{counter-increment:s;display:flex;gap:12px}
.steps-ol li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.notice{background:#ECFEFF;border:1px solid #A5F3FC;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.drop{border:2px dashed #c9d6e2;border-radius:14px;padding:22px;text-align:center;color:var(--muted);transition:all .2s}
.drop.over{border-color:var(--red);background:#fff5f5;color:var(--red)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}
  .logo,.saved,aside .sp{display:none}
  #nav{display:flex;gap:4px}
  .nav-b{flex:none}
  main{padding:18px 14px}
  .item{grid-template-columns:52px 1fr auto;}
  .item .c3,.item .c4,.item .c5{display:none}
  .img-edit{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img id="sideLogo" src="images/logo-mark.png" alt=""><div><b>Royal Plast</b><small>Catalog control panel</small></div></div>
    <div id="nav"></div>
    <div class="sp"></div>
    <div class="saved" id="saved"><i></i><span>All changes saved</span></div>
  </aside>
  <main>
    <div class="top">
      <div><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="actions">
        <button class="btn btn-line" id="btnPreview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Live preview</button>
        <button class="btn btn-red" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>Publish (export)</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" hidden>

<script>
  /* GitHub Pages lets browsers keep files for ~10 minutes. Always load the newest data,
     and if a newer version of the page was published, reload once to get it. */
  window.APP_VERSION = "6";
  document.write('<script src="catalog-data.js?v=' + Date.now() + '"><\/script>');
  fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
    v = v.trim(); const u = new URL(location.href);
    if (v && v !== window.APP_VERSION && u.searchParams.get("v") !== v){ u.searchParams.set("v", v); location.replace(u); }
  }).catch(() => {});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
// fingerprint of catalog content (ignores the _base marker) — tells whether a saved draft was started from the current live file
const sigOf = d => { const s = JSON.stringify({ ...d, _base: undefined }); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };
const PUB_SIG = sigOf(window.CATALOG_DATA);
const fresh = () => { const d = clone(window.CATALOG_DATA); d._base = PUB_SIG; return d; };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "collection";
const IC = {
  products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6v4H9zM8 6h8l1 4v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10z"/></svg>',
  collections:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
  brand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4h9a4 4 0 0 1 0 8H4m7 0 7 9"/></svg>',
  colors:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="12" cy="7" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/></svg>',
  texts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h16"/></svg>',
  whatsapp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/></svg>',
  publish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4 4 4M4 15v5h16v-5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>'
};
const PAGES = {
  products:{t:"Products", s:"Add, edit, reorder and hide products. Click a product to edit it."},
  collections:{t:"Collections", s:"The catalog sections — like “Glow Essentials · NK 63”."},
  brand:{t:"Brand & Contact", s:"Logo, WhatsApp number, phones, website and the social-media QR code."},
  colors:{t:"Brand Colors", s:"Every color in the catalog comes from these five values."},
  texts:{t:"Texts & Layout", s:"Front & back cover, contents page steps and products per page."},
  whatsapp:{t:"WhatsApp Message", s:"The message the sales team receives when a customer taps a product."},
  publish:{t:"Publish", s:"Export your changes and upload them to make them live for everyone."}
};
const LOGO_COLORS = { primary:"#F2222B", secondary:"#1FE0FD", sky:"#5CE6FF", ink:"#0E1A2B", bg:"#F2FCFF" };

/* ---------- storage ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("royalplast",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }

let D, page = "products", filter = { q:"", col:"all" }, previewWin = null, saveT;
function changed(){
  $("#saved span").textContent = "Saving…";
  clearTimeout(saveT);
  saveT = setTimeout(async () => {
    try { await idbSet("draft", D); $("#saved span").textContent = "All changes saved"; }
    catch(e){ $("#saved span").textContent = "Save failed: " + e.message; }
  }, 300);
  pushPreview();
}
function pushPreview(){ if (previewWin && !previewWin.closed) previewWin.postMessage({ type:"rp-data", data:D }, "*"); }
addEventListener("message", e => { if (e.data && e.data.type === "rp-ready") pushPreview(); });

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- images ---------- */
function readImage(file, max = 900){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL("image/webp", .85); if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", .88);
      res(out);
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickFiles({ multiple = false, accept = "image/*" } = {}){
  return new Promise(res => { const i = $("#filePick"); i.value = ""; i.multiple = multiple; i.accept = accept; i.onchange = () => res([...i.files]); i.click(); });
}

/* ---------- binding helpers ---------- */
const getPath = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
function setPath(o, p, v){ const ks = p.split("."), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }
function bindAll(root){
  root.querySelectorAll("[data-bind]").forEach(el => {
    const p = el.dataset.bind, v = getPath(D, p);
    if (el.type === "checkbox") el.checked = !!v; else el.value = v ?? "";
    el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => {
      let val = el.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.num !== undefined) val = +val;
      setPath(D, p, val); changed(); el.dispatchEvent(new Event("bound"));
    });
  });
}
const field = (label, bind, { type = "text", hint = "", full = false, area = false, ph = "" } = {}) =>
  `<div class="f${full ? " full" : ""}"><label>${label}</label>${area ? `<textarea data-bind="${bind}" placeholder="${esc(ph)}"></textarea>` : `<input type="${type}" data-bind="${bind}" placeholder="${esc(ph)}">`}${hint ? `<small>${hint}</small>` : ""}</div>`;

/* ---------- navigation ---------- */
function renderNav(){
  $("#nav").innerHTML = Object.entries(PAGES).map(([k, v]) => `<button class="nav-b${k === page ? " on" : ""}" data-p="${k}">${IC[k]}${v.t}</button>`).join("");
  $("#nav").querySelectorAll(".nav-b").forEach(b => b.onclick = () => { page = b.dataset.p; render(); });
}
function render(){
  renderNav(); $("#pageTitle").textContent = PAGES[page].t; $("#pageSub").textContent = PAGES[page].s;
  ({ products:vProducts, collections:vCollections, brand:vBrand, colors:vColors, texts:vTexts, whatsapp:vWhatsapp, publish:vPublish })[page]();
  scrollTo(0, 0);
}

/* ---------- PRODUCTS ---------- */
function vProducts(){
  $("#view").innerHTML = `
    <div class="toolbar">
      <input id="pq" type="search" placeholder="Search name or code…" value="${esc(filter.q)}">
      <select id="pc"><option value="all">All collections</option>${D.collections.map(c => `<option value="${esc(c.id)}"${filter.col === c.id ? " selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
      <button class="btn btn-red" id="add">${IC.plus}Add product</button>
      <button class="btn btn-line" id="bulk">${IC.plus}Bulk add from images</button>
      <span class="count" id="pcount"></span>
    </div>
    <div class="drop" id="drop">Drop many product photos here to create products in bulk — the file name becomes the product code (e.g. <b>NK 63-05.png</b>).</div>
    <div class="list" id="plist" style="margin-top:14px"></div>`;
  $("#pq").oninput = e => { filter.q = e.target.value; drawList(); };
  $("#pc").onchange = e => { filter.col = e.target.value; drawList(); };
  $("#add").onclick = () => editProduct(null);
  $("#bulk").onclick = async () => bulkAdd(await pickFiles({ multiple:true }));
  const drop = $("#drop");
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => bulkAdd([...e.dataTransfer.files].filter(f => f.type.startsWith("image/"))));
  drawList();
}
function drawList(){
  const q = filter.q.toLowerCase(), cname = id => D.collections.find(c => c.id === id)?.name || "—";
  const list = D.products.filter(p => (filter.col === "all" || p.collection === filter.col) && (!q || (p.name + " " + p.code).toLowerCase().includes(q)));
  $("#pcount").textContent = `${list.length} of ${D.products.length} products`;
  $("#plist").innerHTML = list.length ? list.map(p => `
    <div class="item${p.hidden ? " hidden" : ""}" data-id="${esc(p.id)}">
      <img class="thumb" src="${esc(p.image)}" alt="" onerror="this.style.visibility='hidden'">
      <div><span class="code">${esc(p.code)}</span><div class="nm">${esc(p.name)}</div></div>
      <div class="meta c3">${esc([p.capacity, p.material, p.neck].filter(Boolean).join(" · "))}</div>
      <div class="meta c4">${esc(cname(p.collection))}</div>
      <div class="tags c5">${p.featured ? '<span class="tag star">★ Cover</span>' : ""}${p.hidden ? '<span class="tag">Hidden</span>' : ""}</div>
      <div class="ibtns">
        <button class="ib" data-a="up" title="Move up">${IC.up}</button><button class="ib" data-a="down" title="Move down">${IC.down}</button>
        <button class="ib" data-a="edit" title="Edit">${IC.edit}</button><button class="ib" data-a="dup" title="Duplicate">${IC.copy}</button>
        <button class="ib del" data-a="del" title="Delete">${IC.del}</button>
      </div>
    </div>`).join("") : `<div class="empty">No products yet. Click “Add product”.</div>`;
  $("#plist").querySelectorAll(".item").forEach(row => {
    const id = row.dataset.id;
    row.addEventListener("click", e => {
      const a = e.target.closest("[data-a]")?.dataset.a || "edit", i = D.products.findIndex(p => p.id === id);
      if (a === "edit") return editProduct(id);
      if (a === "up" && i > 0) [D.products[i-1], D.products[i]] = [D.products[i], D.products[i-1]];
      if (a === "down" && i < D.products.length - 1) [D.products[i+1], D.products[i]] = [D.products[i], D.products[i+1]];
      if (a === "dup"){ const c = clone(D.products[i]); c.id = uid(); c.code += " copy"; D.products.splice(i + 1, 0, c); toast("Product duplicated"); }
      if (a === "del"){ if (!confirm(`Delete “${D.products[i].name}”?`)) return; D.products.splice(i, 1); toast("Product deleted"); }
      changed(); drawList();
    });
  });
}
async function bulkAdd(files){
  if (!files.length) return;
  const col = filter.col !== "all" ? filter.col : D.collections[0]?.id;
  toast(`Adding ${files.length} products…`);
  for (const f of files){
    const base = f.name.replace(/\.[^.]+$/, "");
    D.products.push({ id:uid(), code:base.toUpperCase(), name:base.replace(/[-_]+/g," "), collection:col, capacity:"", material:"", neck:"", weight:"", packing:"", colors:[], description:"", image:await readImage(f), featured:false, hidden:false });

}

  for (const k in base){
    if (D.settings[k] === undefined) D.settings[k] = clone(base[k]);
    else if (base[k] && typeof base[k] === "object" && !Array.isArray(base[k])) D.settings[k] = { ...clone(base[k]), ...D.settings[k] };
  }
  if (!["preview","whatsapp"].includes(D.settings.clickAction)) D.settings.clickAction = "preview";
  $("#sideLogo").src = D.settings.logoMark || D.settings.logo;
  render();
  // the published catalog was updated after these edits were started → offer to switch
  if (D._base !== PUB_SIG && sigOf(D) !== PUB_SIG) $("#view").insertAdjacentHTML("afterbegin", `<div class="banner" id="stale"><span>⚠️ The live catalog was updated after you started these edits. Load the live version to make sure you edit the latest products.</span><button class="btn btn-ink btn-sm" id="loadPub">Load live version</button><button class="btn btn-line btn-sm" id="keepDraft">Keep my edits</button></div>`);
  $("#loadPub")?.addEventListener("click", () => { D = fresh(); changed(); render(); toast("Loaded the live catalog"); });
  $("#keepDraft")?.addEventListener("click", () => { D._base = PUB_SIG; changed(); $("#stale").remove(); });
})();
</script>
</body>
</html>

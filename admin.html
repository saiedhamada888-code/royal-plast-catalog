<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Plast Admin</title>
<link rel="icon" href="images/logo-mark.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#F2222B;--cyan:#1FE0FD;--sky:#5CE6FF;--ink:#0E1A2B;--bg:#F4F8FB;--card:#fff;--line:#E3EAF0;--muted:#6B7A8C;--ok:#16A34A;
  --multi:conic-gradient(#F2222B,#F6D02F,#38D4C0,#1F6FE0,#A77BE0,#F2222B)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #1fe0fd26}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--red);flex:none;cursor:pointer}
input[type=color]{width:44px;height:38px;padding:3px;flex:none;cursor:pointer}
/* layout: sidebar | editor | live preview */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) var(--pv,0px);height:100vh}
body.pv-on{--pv:min(40vw,680px)}
aside{background:var(--ink);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo img{width:40px;height:40px;border-radius:12px;background:#fff;padding:5px}
.logo b{display:block;font-size:15px}.logo small{opacity:.6;font-size:11.5px}
.nav-b{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-weight:500;font-size:13.5px;opacity:.72;text-align:left;transition:all .2s;width:100%}
.nav-b svg{width:18px;height:18px;flex:none}
.nav-b:hover{opacity:1;background:#ffffff12}
.nav-b.on{opacity:1;background:var(--red);box-shadow:0 8px 18px #f2222b55}
.nav-b em{margin-left:auto;font-style:normal;font-size:11px;background:#ffffff22;border-radius:99px;padding:1px 8px}
aside .sp{flex:1}
.saved{font-size:12px;opacity:.75;padding:8px 12px;display:flex;align-items:center;gap:8px}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.saved.busy i{background:#F59E0B}
main{overflow:auto;padding:22px 28px 80px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:22px}
.top p{color:var(--muted);font-size:12.5px;max-width:560px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px #f2222b40}
.btn-ink{background:var(--ink);color:#fff}
.btn-line{border:1.5px solid var(--line);background:#fff}
.btn-line:hover{border-color:var(--ink)}
.btn-line.on{border-color:var(--red);color:var(--red)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h3{font-size:15.5px;margin-bottom:3px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.f label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:#3b4859}
.f small{display:block;color:var(--muted);font-size:11.5px;margin-top:4px}
.f.full{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;margin:6px 0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:170px}
.toolbar .grow{flex:1;min-width:200px}
.count{color:var(--muted);font-size:12.5px;margin-left:auto}
.meta{color:var(--muted);font-size:12.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.code{display:inline-block;background:var(--red);color:#fff;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.code.own{background:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg);white-space:nowrap}
.tag.star{background:#FFF4D6;color:#A16207}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px #0004;flex:none}
.ib{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#4b5a6b;transition:background .2s,color .2s;flex:none}
.ib:hover{background:var(--bg);color:var(--ink)}
.ib.del:hover{background:#FEE2E2;color:var(--red)}
.ib svg{width:16px;height:16px}
.ibtns{display:flex;gap:2px}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex:none}
/* products */
.plist{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:22px 18px 52px minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 12px;transition:box-shadow .2s,border-color .2s,opacity .2s}
.item:hover{border-color:#cfd9e3;box-shadow:0 6px 16px #0e1a2b0d}
.item.sel{border-color:var(--red);background:#FFF7F7}
.item.hid{opacity:.5}
.item.drag{opacity:.35}
.item.over{box-shadow:0 -3px 0 var(--red)}
.grip{cursor:grab;color:#9aa8b6;display:grid;place-items:center}
.grip svg{width:16px}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.bulk{position:sticky;top:-22px;z-index:5;display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;box-shadow:0 10px 24px #0e1a2b40}
.bulk.on{display:flex}
.bulk select{width:auto;padding:6px 10px;font-size:12.5px;background:#ffffff14;color:#fff;border-color:#ffffff33}
.bulk select option{color:var(--ink)}
.bulk .btn-line{background:transparent;color:#fff;border-color:#ffffff40}
.drop{border:2px dashed #c9d6e2;border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px;transition:all .2s}
.drop.over{border-color:var(--red);background:#fff5f5;color:var(--red)}
/* pages */
.pgcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;transition:border-color .2s}
.pgcard:hover{border-color:#cfd9e3}
.pgnum{width:54px;text-align:center}
.pgnum b{display:block;font-size:22px;line-height:1}
.pgnum small{font-size:11px;color:var(--muted)}
.pgthumbs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.pgthumbs img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.codein{display:flex;align-items:center;border:1.5px solid var(--red);border-radius:999px;overflow:hidden;background:#fff;width:max-content}
.codein span{background:var(--red);color:#fff;font-weight:700;padding:7px 12px;font-size:13px}
.codein input{border:0;width:90px;padding:7px 12px;font-weight:700;border-radius:0;box-shadow:none}
.pgfields{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pgfields input[data-pf=title],.pgfields input[data-pf=desc]{flex:1 1 200px;width:auto}
.pgfields .codein{order:-2}.pgfields [data-view]{order:-1;margin-right:auto}
/* drawer */
.modal{position:fixed;inset:0;z-index:50;background:#0e1a2b80;backdrop-filter:blur(3px);display:none;justify-content:flex-end}
.modal.open{display:flex}
.drawer{width:min(600px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px;animation:slide .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.drawer-h h2{font-size:19px}
.img-edit{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}
.img-prev{width:140px;height:140px;border-radius:16px;border:1.5px solid var(--ink);object-fit:cover;background:#fff}
.colors-ed{display:flex;flex-direction:column;gap:8px}
.drawer-f{position:sticky;bottom:-22px;margin:18px -22px -22px;padding:14px 22px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
/* misc */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.swc{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px}
.swc b{display:block;font-size:13px}
.swc input[type=text]{padding:5px 9px;font-size:13px}
.famrow{display:grid;grid-template-columns:36px 1fr auto 46px auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.famrow .big{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px #0003}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.feat-grid button{position:relative;border-radius:12px;overflow:hidden;border:2px solid transparent;aspect-ratio:1;background:#fff}
.feat-grid button img{width:100%;height:100%;object-fit:cover}
.feat-grid button.on{border-color:var(--red);box-shadow:0 0 0 3px #f2222b33}
.feat-grid button.on::after{content:"★";position:absolute;top:4px;right:6px;color:var(--red);font-size:14px;text-shadow:0 0 3px #fff}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ph button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;font-family:monospace}
.ph button:hover{border-color:var(--red);color:var(--red)}
.msg-prev{white-space:pre-wrap;background:#E7FFDB;border-radius:12px 12px 2px 12px;padding:14px 16px;font-size:13px;line-height:1.55;max-width:420px;box-shadow:0 2px 6px #0001;margin-left:auto}
.wa-bg{background:#EFE7DD;border-radius:14px;padding:18px}
.qr-prev{width:116px;height:116px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px;flex:none}
.qr-prev canvas,.qr-prev img{width:100%!important;height:100%!important}
.steps-ol{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps-ol li{counter-increment:s;display:flex;gap:12px}
.steps-ol li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.notice{background:#ECFEFF;border:1px solid #A5F3FC;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:14px}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FFF7E6;border:1px solid #FCD9A0;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.banner span{flex:1;min-width:220px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;transition:all .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* live preview panel */
.pv{display:none;border-left:1px solid var(--line);background:#EAF2F6;flex-direction:column;min-width:0}
body.pv-on .pv{display:flex}
.pv-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.pv-h b{font-size:13px;flex:1;display:flex;align-items:center;gap:8px}
.pv-h b i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px #16a34a33}
.pv iframe{flex:1;border:0;width:100%;background:#EAF6FA}
@media (max-width:1100px){body.pv-on{--pv:0px}body.pv-on .pv{display:none}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;height:auto}
  aside{flex-direction:row;overflow-x:auto;padding:8px;position:sticky;top:0;z-index:20}
  .logo,.saved,aside .sp{display:none}
  .nav-b{flex:none;width:auto}
  main{padding:16px 12px 60px;overflow:visible}
  .item{grid-template-columns:22px 52px minmax(0,1fr) auto}
  .item .grip,.item .c5{display:none}
  .img-edit{grid-template-columns:1fr}
  .pgfields{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><img id="sideLogo" src="images/logo-mark.png" alt=""><div><b>Royal Plast</b><small>Catalog control panel</small></div></div>
    <div id="nav"></div>
    <div class="sp"></div>
    <div class="saved" id="saved"><i></i><span>All changes saved</span></div>
  </aside>
  <main id="main">
    <div class="top">
      <div><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="actions">
        <button class="btn btn-line" id="btnPv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M13 4v16"/></svg><span>Live preview</span></button>
        <button class="btn btn-red" id="btnPublish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4 4 4M4 15v5h16v-5"/></svg>Publish</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
  <section class="pv">
    <div class="pv-h"><b><i></i>Live preview — updates as you type</b>
      <button class="btn btn-line btn-sm" id="pvNew" title="Open the preview in a new tab">Open in new tab</button>
      <button class="ib" id="pvClose" title="Hide preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <iframe id="pvFrame" title="Catalog preview"></iframe>
  </section>
</div>

<div class="modal" id="modal"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="filePick" hidden>

<script>
  window.APP_VERSION = "8";
  document.write('<script src="catalog-data.js?v=' + Date.now() + '"><\/script>');
  fetch("version.txt?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "").then(v => {
    v = v.trim(); const u = new URL(location.href);
    if (v && v !== window.APP_VERSION && u.searchParams.get("v") !== v){ u.searchParams.set("v", v); location.replace(u); }
  }).catch(() => {});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "item";
const sigOf = d => { const s = JSON.stringify({ ...d, _base: undefined }); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return String(h); };
const PUB_SIG = sigOf(window.CATALOG_DATA);
const fresh = () => { const d = clone(window.CATALOG_DATA); d._base = PUB_SIG; return d; };
const IC = {
  products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6v4H9zM8 6h8l1 4v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10z"/></svg>',
  pages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/></svg>',
  collections:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><circle cx="17.5" cy="17.5" r="3.5"/></svg>',
  covers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h12l2 2v16H5z"/><path d="M9 8h6M9 12h6"/></svg>',
  texts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h16"/></svg>',
  brand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V4h9a4 4 0 0 1 0 8H4m7 0 7 9"/></svg>',
  colors:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="12" cy="7" r="1.5" fill="currentColor"/><circle cx="16" cy="10" r="1.5" fill="currentColor"/></svg>',
  whatsapp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/></svg>',
  publish:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0L8 7m4-4 4 4M4 15v5h16v-5"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 15 6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  view:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M21 3l-9 9M19 14v6H4V5h6"/></svg>'
};
const PAGES = {
  products:   { t:"Products", s:"Add, edit, hide, reorder (drag ⠿) and organise products. Tick several to change them all at once." },
  pages:      { t:"Pages & Codes", s:"Every page has a red code (e.g. NK 24). All products on that page show the same code automatically." },
  collections:{ t:"Sections & Color groups", s:"The catalog sections (Bottles, Jars, Pumps…) and the color groups inside them (White, Black, Clear…)." },
  covers:     { t:"Cover & Last page", s:"Front cover texts and photos, and the animated thank-you page at the end." },
  texts:      { t:"Texts & Layout", s:"Contents page, “how to order” steps, every label, and how pages behave." },
  brand:      { t:"Brand & Contact", s:"Logo, WhatsApp number, phones, website and the social-media QR — all clickable in the catalog." },
  colors:     { t:"Brand Colors", s:"Every color in the catalog comes from these five values." },
  whatsapp:   { t:"WhatsApp Message", s:"The message the sales team receives when a customer taps “Order Now”." },
  publish:    { t:"Publish", s:"Make your changes live for customers, and keep backups." }
};

const LAYOUTS = { 1:{c:1,r:1}, 2:{c:2,r:1}, 4:{c:2,r:2}, 6:{c:3,r:2}, 9:{c:3,r:3}, 12:{c:4,r:3} };

/* ---------- storage ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("royalplast",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }

  clearTimeout(saveT);

  }, 300);

}
const frame = () => $("#pvFrame").contentWindow;
function pushPreview(){
  const msg = { type:"rp-data", data:D };
  if (document.body.classList.contains("pv-on")) try { frame().postMessage(msg, "*"); } catch(_) {}

/* ---------- catalog logic (same rules as the catalog itself) ---------- */
const fams = () => D.settings.families || (D.settings.families = []);
const swBg = hex => hex === "multi" ? "var(--multi)" : hex;
const swatch = f => `<i class="sw" style="background:${esc(swBg(f.hex))}"></i>`;
const famOf = p => fams().find(f => f.id === p.family);
const colOf = p => D.collections.find(c => c.id === p.collection);
const prefixed = num => {
  const pre = String(D.settings.codePrefix || "").trim(), n = String(num ?? "").trim();
  if (!n) return pre; if (!pre || n.toUpperCase().startsWith(pre.toUpperCase())) return n;
  return pre + " " + n;
};
function computePages(){
  const s = D.settings, vis = D.products.filter(p => !p.hidden), out = []; let idx = 2;
  D.collections.forEach(c => {
    const items = vis.filter(p => p.collection === c.id); if (!items.length) return;
    const L = LAYOUTS[+c.perPage || +s.layout.perPage] || LAYOUTS[6];
    let groups = [{ f:null, items }];
    if (c.groupByFamily !== false && fams().length){
      groups = fams().map(f => ({ f, items:items.filter(p => p.family === f.id) })).filter(g => g.items.length);
      const rest = items.filter(p => !famOf(p)); if (rest.length) groups.push({ f:null, items:rest });
    }
    const rows = [];
    groups.forEach(g => { for (let k = 0; k < g.items.length; k += L.c) rows.push({ f:g.f, items:g.items.slice(k, k + L.c) }); });
    for (let k = 0, n = 0; k < rows.length; k += L.r, n++){
      const pr = rows.slice(k, k + L.r);
      out.push({ key:`${c.id}#${n}`, col:c, n, index:idx++, items:pr.flatMap(r => r.items), fams:[...new Set(pr.map(r => r.f).filter(Boolean))] });
    }
  });
  return out;
}
const pageSet = key => (D.settings.pages || (D.settings.pages = {}))[key] || (D.settings.pages[key] = {});
const pageCode = pg => prefixed((D.settings.pages?.[pg.key] || {}).code || pg.col.code);
function codeMap(){ const m = {}; computePages().forEach(pg => { const c = pageCode(pg); pg.items.forEach(p => m[p.id] = { code:c, page:pg.index }); }); return m; }
function guessFamily(name){
  const n = name.toLowerCase(), has = (...w) => w.some(x => n.includes(x));
  const id = has("white","abyad","ابيض","أبيض") ? "white" : has("black","aswad","اسود","أسود") ? "black" : has("clear","transparent","shafaf","شفاف") ? "clear" : has("gold","silver","دهبي","ذهبي","فضي") ? "metallic" : "";
  return fams().some(f => f.id === id) ? id : "";
}

/* ---------- images ---------- */
function readImage(file, max = 800){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      let out = c.toDataURL("image/webp", .84); if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", .86);
      res(out);
    }; img.onerror = rej; img.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
function pickFiles({ multiple = false, accept = "image/*" } = {}){
  return new Promise(res => { const i = $("#filePick"); i.value = ""; i.multiple = multiple; i.accept = accept; i.onchange = () => res([...i.files]); i.click(); });
}

/* ---------- generic binding: data-bind="settings.cover.title" ---------- */
const getPath = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
function setPath(o, p, v){ const ks = p.split("."), last = ks.pop(); ks.reduce((a, k) => a[k] ??= {}, o)[last] = v; }
function bindAll(root){
  root.querySelectorAll("[data-bind]").forEach(el => {
    const p = el.dataset.bind, v = getPath(D, p);
    if (el.type === "checkbox") el.checked = v !== false && v !== undefined ? !!v : false; else el.value = v ?? "";
    el.addEventListener(el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input", () => {
      let val = el.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.num !== undefined) val = +val;
      setPath(D, p, val); changed(); el.dispatchEvent(new Event("bound"));
    });
  });
}

/* ================= PAGES & CODES ================= */
function vPages(){
  const pgs = computePages(), pre = D.settings.codePrefix || "";
  $("#view").innerHTML = `
    <div class="card"><h3>Code prefix</h3><p class="hint">Written before every page number — e.g. <b>NK</b> → “NK 24”. Change it once here and every page updates.</p>
      <div class="row" style="max-width:360px"><input id="prefix" value="${esc(pre)}" placeholder="NK" style="max-width:140px;font-weight:700"><span class="meta">Example: <b id="prefEx">${esc(prefixed("24"))}</b></span></div>
    </div>
    ${D.collections.map(c => {
      const cp = pgs.filter(p => p.col.id === c.id); if (!cp.length) return "";
      return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div><h3>${esc(c.name)}</h3><p class="hint" style="margin:0">${cp.length} page${cp.length > 1 ? "s" : ""} · default code <b>${esc(prefixed(c.code))}</b> (change it in Sections)</p></div></div>
        ${cp.map(pg => { const ps = (D.settings.pages || {})[pg.key] || {};
          return `<div class="pgcard" data-key="${esc(pg.key)}" data-index="${pg.index}">
            <div class="pgnum"><small>Page</small><b>${pg.index + 1}</b></div>
            <div>
              <div class="pgfields">
                <div class="codein" title="The red code at the top of this page"><span class="pre">${esc(pre || "—")}</span><input data-pf="code" value="${esc(ps.code || "")}" placeholder="${esc(c.code)}"></div>
                <input data-pf="title" value="${esc(ps.title || "")}" placeholder="Title: ${esc(c.name + (D.settings.labels.catalogSuffix || ""))}">
                <input data-pf="desc" value="${esc(ps.desc || "")}" placeholder="Description: same as the section">
                <button class="btn btn-line btn-sm" data-view>${IC.view}View</button>
              </div>
              <div class="pgthumbs">${pg.items.map(p => `<img src="${esc(p.image)}" title="${esc(p.name)}" loading="lazy">`).join("")}</div>
              <div class="row" style="gap:6px;flex-wrap:wrap">${pg.fams.map(f => `<span class="tag">${swatch(f)}${esc(f.name)}</span>`).join("")}<span class="meta">${pg.items.length} products · all show <b class="pgc">${esc(pageCode(pg))}</b></span></div>
            </div></div>`; }).join("")}
      </div>`;
    }).join("")}`;
  $("#prefix").oninput = e => {
    D.settings.codePrefix = e.target.value.trim(); changed();
    $("#prefEx").textContent = prefixed("24");
    $("#view").querySelectorAll(".pre").forEach(s => s.textContent = D.settings.codePrefix || "—");
    $("#view").querySelectorAll(".pgcard").forEach(updatePgCode);
  };
  $("#view").querySelectorAll(".pgcard").forEach(card => {
    const key = card.dataset.key;
    card.querySelectorAll("[data-pf]").forEach(inp => inp.addEventListener("input", () => {
      const ps = pageSet(key), k = inp.dataset.pf, v = inp.value.trim();
      if (v) ps[k] = v; else delete ps[k];
      changed(); updatePgCode(card);
    }));
    card.querySelectorAll("[data-pf]").forEach(inp => inp.addEventListener("focus", () => previewGoto({ type:"rp-goto", page:+card.dataset.index })));
    card.querySelector("[data-view]").onclick = () => { if (!document.body.classList.contains("pv-on")) togglePv(true); setTimeout(() => previewGoto({ type:"rp-goto", page:+card.dataset.index }), 300); };
  });
}
function updatePgCode(card){
  const pg = computePages().find(p => p.key === card.dataset.key); if (pg) card.querySelector(".pgc").textContent = pageCode(pg);
}

/* ================= SECTIONS & COLOR GROUPS ================= */
function vCollections(){
  D.collections.forEach(c => { if (c.groupByFamily === undefined) c.groupByFamily = true; });
  $("#view").innerHTML = `<div class="toolbar"><button class="btn btn-red" id="addCol">${IC.plus}Add section</button></div><div id="clist"></div>`;
  $("#addCol").onclick = () => { const name = prompt("Section name (e.g. Tubes)"); if (!name) return; let id = slug(name), n = 2; while (D.collections.some(c => c.id === id)) id = slug(name) + "-" + n++; D.collections.push({ id, name, code:"24", perPage:"", groupByFamily:true, description:"" }); changed(); vCollections(); };
  $("#clist").innerHTML = D.collections.map((c, i) => `
    <div class="card" data-i="${i}">
      <div class="row" style="justify-content:space-between;margin-bottom:12px"><h3>${esc(c.name)} <span class="meta" style="font-weight:400">· ${D.products.filter(p => p.collection === c.id).length} products</span></h3>
        <div class="ibtns"><button class="ib" data-a="up" title="Move up">${IC.up}</button><button class="ib" data-a="down" title="Move down">${IC.down}</button><button class="ib del" data-a="del" title="Delete">${IC.del}</button></div></div>
      <div class="fields">
        ${field("Name", `collections.${i}.name`)}
        ${field("Default page code number", `collections.${i}.code`, { ph:"24", hint:`Shows as <b>${esc(prefixed(c.code))}</b>. Each page can still have its own number in Pages & Codes.` })}
        <div class="f"><label>Products per page</label><select data-bind="collections.${i}.perPage"><option value="">Default (Texts & Layout)</option>${PER_PAGE.map(([n, t]) => `<option value="${n}">${t}</option>`).join("")}</select></div>
        ${field("Description (under the page title)", `collections.${i}.description`, { full:true, area:true })}
      </div>
      ${check("Group products by color (white together, black together, clear together…)", `collections.${i}.groupByFamily`)}
    </div>`).join("") + famCard();
  bindAll($("#clist"));
  $("#clist").querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const i = +b.closest(".card").dataset.i, a = b.dataset.a, c = D.collections[i];
    if (a === "up" && i > 0) [D.collections[i-1], D.collections[i]] = [c, D.collections[i-1]];
    if (a === "down" && i < D.collections.length - 1) [D.collections[i+1], D.collections[i]] = [c, D.collections[i+1]];
    if (a === "del"){ const n = D.products.filter(p => p.collection === c.id).length; if (n) return toast(`Move or delete its ${n} products first`); if (!confirm(`Delete section “${c.name}”?`)) return; D.collections.splice(i, 1); }
    changed(); vCollections();
  });
  bindFamilies();
}
function famCard(){
  return `<div class="card" id="famCard"><h3>Color groups</h3>
    <p class="hint">Inside every section, products are grouped in this order. Each group starts on a new row with its own label and appears in the contents page.</p>
    ${fams().map((f, i) => `
      <div class="famrow" data-fi="${i}">
        <span class="big" style="background:${esc(swBg(f.hex))}"></span>
        <input data-ff="name" value="${esc(f.name)}" placeholder="Group name">
        <label class="check" style="margin:0"><input type="checkbox" data-ff="multi"${f.hex === "multi" ? " checked" : ""}> Multicolor</label>
        <input type="color" data-ff="hex" value="${f.hex === "multi" ? "#ffffff" : esc(f.hex)}"${f.hex === "multi" ? " disabled" : ""}>
        <span class="meta">${D.products.filter(p => p.family === f.id).length} products</span>
        <div class="ibtns"><button class="ib" data-fa="up">${IC.up}</button><button class="ib" data-fa="down">${IC.down}</button><button class="ib del" data-fa="del">${IC.del}</button></div>
      </div>`).join("")}
    <button class="btn btn-line btn-sm" id="addFam" style="margin-top:8px">${IC.plus}Add color group</button>
  </div>`;
}
function bindFamilies(){
  const card = $("#famCard");
  card.addEventListener("input", e => {
    const row = e.target.closest("[data-fi]"); if (!row) return;
    const f = fams()[+row.dataset.fi], k = e.target.dataset.ff;
    if (k === "name") f.name = e.target.value;
    if (k === "hex"){ f.hex = e.target.value; row.querySelector(".big").style.background = f.hex; }
    if (k !== "multi") changed();
  });
  card.addEventListener("change", e => {
    if (e.target.dataset.ff !== "multi") return;
    const row = e.target.closest("[data-fi]"), f = fams()[+row.dataset.fi], hexIn = row.querySelector("[data-ff=hex]");
    f.hex = e.target.checked ? "multi" : hexIn.value; hexIn.disabled = e.target.checked;
    row.querySelector(".big").style.background = swBg(f.hex); changed();
  });
  card.querySelectorAll("[data-fa]").forEach(b => b.onclick = () => {
    const i = +b.closest("[data-fi]").dataset.fi, a = b.dataset.fa, list = fams(), f = list[i];
    if (a === "up" && i > 0) [list[i-1], list[i]] = [f, list[i-1]];
    if (a === "down" && i < list.length - 1) [list[i+1], list[i]] = [f, list[i+1]];
    if (a === "del"){
      const used = D.products.filter(p => p.family === f.id);
      if (!confirm(used.length ? `Delete “${f.name}”? Its ${used.length} products will have no color group.` : `Delete “${f.name}”?`)) return;
      used.forEach(p => p.family = ""); list.splice(i, 1);
    }
    changed(); vCollections();
  });
  $("#addFam").onclick = () => {
    const name = prompt("Color group name (e.g. Amber)"); if (!name) return;
    let id = slug(name), n = 2; while (fams().some(f => f.id === id)) id = slug(name) + "-" + n++;
    fams().push({ id, name, hex:"#cccccc" }); changed(); vCollections();
  };
}

      </ol>
    </div>
    <div class="card"><h3>Backup & restore</h3><p class="hint">Keep a backup before big changes, or move your work to another computer.</p>
      <div class="row" style="flex-wrap:wrap"><button class="btn btn-line" id="ex2">Download backup (.json)</button><button class="btn btn-line" id="imp">Import backup / catalog-data.js</button><button class="btn btn-line" id="rst" style="color:var(--red)">Discard my edits — load the live catalog</button></div>
    </div>`;
  $("#ex1").onclick = exportJS;
  $("#ex2").onclick = () => download(`royal-plast-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(D, null, 1), "application/json");
  $("#imp").onclick = async () => {
    const [f] = await pickFiles({ accept:".json,.js" }); if (!f) return;
    try {
      const txt = (await f.text()).replace(/^[\s\S]*?window\.CATALOG_DATA\s*=\s*/, "").replace(/;\s*$/, "");
      const d = JSON.parse(txt); if (!d.settings || !d.products) throw new Error("Not a catalog file");
      d._base = PUB_SIG; D = withDefaults(d); changed(); render(); toast("Imported");
    } catch(e){ alert("Could not import: " + e.message); }
  };
  $("#rst").onclick = () => { if (!confirm("Discard all unpublished edits?")) return; D = fresh(); changed(); render(); toast("Loaded the live catalog"); };
}
function download(name, text, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
function exportJS(){
  const out = clone(D); delete out._base;
  download("catalog-data.js", `/* Royal Plast catalog data — exported ${new Date().toLocaleString()} from admin.html */\nwindow.CATALOG_DATA = ${JSON.stringify(out, null, 1)};\n`, "text/javascript");
  toast("Downloaded — now upload it on GitHub (step 2)");
}

/* ---------- preview panel ---------- */
function togglePv(on){
  document.body.classList.toggle("pv-on", on);
  $("#btnPv").classList.toggle("on", on);
  if (on && !$("#pvFrame").src) $("#pvFrame").src = "index.html?preview=1";
  else if (on) pushPreview();
  try { localStorage.setItem("rp-pv", on ? "1" : "0"); } catch(_) {}
}
$("#btnPv").onclick = () => togglePv(!document.body.classList.contains("pv-on"));
$("#pvClose").onclick = () => togglePv(false);
$("#pvNew").onclick = () => { previewWin = window.open("index.html?preview=1", "rp-preview"); };
$("#btnPublish").onclick = () => { page = "publish"; render(); };

/* ---------- boot ---------- */
function withDefaults(d){
  const base = window.CATALOG_DATA.settings;
  for (const k in base){
    if (d.settings[k] === undefined) d.settings[k] = clone(base[k]);
    else if (base[k] && typeof base[k] === "object" && !Array.isArray(base[k]) && k !== "pages") d.settings[k] = { ...clone(base[k]), ...d.settings[k] };
  }
  if (!["preview","whatsapp"].includes(d.settings.clickAction)) d.settings.clickAction = "preview";
  d.collections.forEach(c => { if (c.groupByFamily === undefined) c.groupByFamily = true; });
  return d;
}
(async function boot(){
  try { D = await idbGet("draft"); } catch(_) {}
  if (!D) D = fresh();
  D = withDefaults(D);
  $("#sideLogo").src = D.settings.logoMark || D.settings.logo;
  render();
  if (D._base !== PUB_SIG && sigOf(D) !== PUB_SIG){
    $("#view").insertAdjacentHTML("afterbegin", `<div class="banner" id="stale"><span>⚠️ The live catalog was updated after you started these edits. Load the live version so you edit the latest products.</span><button class="btn btn-ink btn-sm" id="loadPub">Load live version</button><button class="btn btn-line btn-sm" id="keepDraft">Keep my edits</button></div>`);
    $("#loadPub").onclick = () => { D = fresh(); changed(); render(); toast("Loaded the live catalog"); };
    $("#keepDraft").onclick = () => { D._base = PUB_SIG; changed(); $("#stale").remove(); };
  }
  let pv = innerWidth > 1100; try { const v = localStorage.getItem("rp-pv"); if (v !== null) pv = v === "1" && innerWidth > 1100; } catch(_) {}
  togglePv(pv);
})();
</script>
</body>
